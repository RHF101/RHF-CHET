<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chet</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

  :root {
    --wa-green: #25D366;
    --wa-dark: #075E54;
    --wa-teal: #128C7E;
    --wa-panel: #111B21;
    --wa-chat-bg: #0B141A;
    --wa-sidebar: #111B21;
    --wa-item-hover: #1F2C34;
    --wa-item-active: #2A3942;
    --wa-msg-out: #005C4B;
    --wa-msg-in: #1F2C34;
    --wa-text: #E9EDEF;
    --wa-text-muted: #8696A0;
    --wa-border: #222D34;
    --wa-input-bg: #2A3942;
  }

  html, body { height: 100%; height: 100dvh; overflow: hidden; background: var(--wa-chat-bg); }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; flex-direction: column; gap: 24px;
    background: var(--wa-panel);
  }
  #login-screen .logo {
    width: 80px; height: 80px; background: var(--wa-green);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 40px;
  }
  #login-screen h1 { color: var(--wa-text); font-size: 28px; font-weight: 300; }
  #login-screen p { color: var(--wa-text-muted); font-size: 14px; text-align: center; max-width: 300px; }
  #btn-google {
    display: flex; align-items: center; gap: 12px; padding: 12px 24px;
    background: var(--wa-green); color: #fff; border: none; border-radius: 8px;
    font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s;
  }
  #btn-google:hover { background: var(--wa-teal); }

  /* ── APP SHELL ── */
  #app { display: none; height: 100vh; height: 100dvh; }
  #app.visible { display: flex; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 360px; min-width: 280px; display: flex; flex-direction: column;
    border-right: 1px solid var(--wa-border); background: var(--wa-sidebar);
    flex-shrink: 0;
  }

  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--wa-item-active); height: 60px;
  }
  .sidebar-header .user-info { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--wa-teal); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .header-actions { display: flex; gap: 4px; }
  .icon-btn {
    background: none; border: none; color: var(--wa-text-muted); cursor: pointer;
    padding: 8px; border-radius: 50%; font-size: 20px; line-height: 1;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--wa-item-hover); color: var(--wa-text); }

  .search-bar {
    padding: 8px 12px; background: var(--wa-panel);
    border-bottom: 1px solid var(--wa-border);
  }
  .search-bar input {
    width: 100%; padding: 8px 16px; border-radius: 8px;
    background: var(--wa-input-bg); border: none; color: var(--wa-text);
    font-size: 14px; outline: none;
  }
  .search-bar input::placeholder { color: var(--wa-text-muted); }

  .rooms-list { flex: 1; overflow-y: auto; }
  .rooms-list::-webkit-scrollbar { width: 6px; }
  .rooms-list::-webkit-scrollbar-thumb { background: var(--wa-border); border-radius: 3px; }

  .room-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    cursor: pointer; border-bottom: 1px solid var(--wa-border); transition: background .15s;
  }
  .room-item:hover { background: var(--wa-item-hover); }
  .room-item.active { background: var(--wa-item-active); }
  .room-icon {
    width: 48px; height: 48px; border-radius: 50%; background: var(--wa-teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; flex-shrink: 0;
  }
  .room-info { flex: 1; min-width: 0; }
  .room-name { color: var(--wa-text); font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-preview { color: var(--wa-text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .room-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .room-time { color: var(--wa-text-muted); font-size: 11px; }
  .unread-badge {
    background: var(--wa-green); color: #fff; font-size: 11px; font-weight: 600;
    border-radius: 50%; width: 18px; height: 18px; display: flex;
    align-items: center; justify-content: center;
  }

  .new-room-btn {
    margin: 12px; margin-bottom: max(12px, env(safe-area-inset-bottom));
    padding: 12px; border-radius: 8px; background: var(--wa-green);
    color: #fff; border: none; font-size: 14px; cursor: pointer; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .2s; flex-shrink: 0;
  }
  .new-room-btn:hover { background: var(--wa-teal); }

  /* ── CHAT AREA ── */
  #chat-area {
    flex: 1; display: flex; flex-direction: column;
    background: var(--wa-chat-bg); position: relative;
  }

  #welcome-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: var(--wa-text-muted);
  }
  #welcome-screen .big-icon { font-size: 80px; }
  #welcome-screen h2 { color: var(--wa-text); font-size: 22px; font-weight: 300; }
  #welcome-screen p { font-size: 14px; max-width: 300px; text-align: center; line-height: 1.6; }

  .chat-header {
    display: none; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--wa-item-active); height: 60px;
    border-bottom: 1px solid var(--wa-border);
  }
  .chat-header.visible { display: flex; }
  .chat-header-info { flex: 1; }
  .chat-header-name { color: var(--wa-text); font-size: 16px; font-weight: 500; }
  .chat-header-status { color: var(--wa-green); font-size: 12px; }

  #messages-area {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #messages-area::-webkit-scrollbar { width: 6px; }
  #messages-area::-webkit-scrollbar-thumb { background: var(--wa-border); border-radius: 3px; }

  .msg-wrapper { display: flex; flex-direction: column; max-width: 65%; }
  .msg-wrapper.out { align-self: flex-end; align-items: flex-end; }
  .msg-wrapper.in { align-self: flex-start; }

  .msg-bubble {
    padding: 7px 12px 8px; border-radius: 8px; position: relative;
    max-width: 100%; word-break: break-word;
  }
  .msg-wrapper.out .msg-bubble { background: var(--wa-msg-out); border-radius: 8px 0 8px 8px; }
  .msg-wrapper.in .msg-bubble { background: var(--wa-msg-in); border-radius: 0 8px 8px 8px; }

  .msg-sender { font-size: 12px; color: var(--wa-green); font-weight: 500; margin-bottom: 2px; }
  .msg-text { color: var(--wa-text); font-size: 14px; line-height: 1.5; }
  .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
  .msg-time { font-size: 11px; color: var(--wa-text-muted); }
  .msg-tick { font-size: 14px; color: var(--wa-green); }

  .date-divider {
    align-self: center; background: var(--wa-item-active); color: var(--wa-text-muted);
    font-size: 12px; padding: 4px 12px; border-radius: 8px; margin: 8px 0;
  }

  .chat-input-area {
    display: none; align-items: center; gap: 8px; padding: 8px 16px;
    background: var(--wa-item-active); border-top: 1px solid var(--wa-border);
  }
  .chat-input-area.visible { display: flex; }
  #msg-input {
    flex: 1; padding: 10px 16px; border-radius: 24px;
    background: var(--wa-input-bg); border: none; color: var(--wa-text);
    font-size: 15px; outline: none; resize: none; max-height: 120px;
    line-height: 1.4;
  }
  #msg-input::placeholder { color: var(--wa-text-muted); }
  #btn-send {
    width: 48px; height: 48px; border-radius: 50%; background: var(--wa-green);
    border: none; color: #fff; font-size: 20px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  #btn-send:hover { background: var(--wa-teal); }
  #btn-send:disabled { background: var(--wa-item-hover); cursor: default; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--wa-panel); border-radius: 12px; padding: 24px;
    width: 360px; display: flex; flex-direction: column; gap: 16px;
    border: 1px solid var(--wa-border);
  }
  .modal h3 { color: var(--wa-text); font-size: 18px; }
  .modal input {
    padding: 10px 14px; border-radius: 8px; background: var(--wa-input-bg);
    border: 1px solid var(--wa-border); color: var(--wa-text); font-size: 14px; outline: none;
  }
  .modal input:focus { border-color: var(--wa-green); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel { padding: 8px 20px; border-radius: 8px; background: none; border: 1px solid var(--wa-border); color: var(--wa-text-muted); cursor: pointer; }
  .btn-create { padding: 8px 20px; border-radius: 8px; background: var(--wa-green); border: none; color: #fff; cursor: pointer; font-weight: 500; }

  @media (max-width: 640px) {
    #sidebar { width: 100%; }
    #sidebar.hidden { display: none; }
    #chat-area { width: 100%; }
    #chat-area.hidden { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="logo">💬</div>
  <h1>Chet</h1>
  <p>Hubungkan akun Google kamu untuk mulai chat real-time</p>
  <button id="btn-google">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/><path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9.008 9.008 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.95 13.04C2.44 15.98 5.48 18 9 18z"/></svg>
    Masuk dengan Google
  </button>
</div>

<!-- APP -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="avatar" id="user-avatar">👤</div>
        <span style="color:var(--wa-text);font-size:15px;font-weight:500" id="user-name">Kamu</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-logout" title="Keluar">⎋</button>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Cari atau mulai chat baru">
    </div>

    <div class="rooms-list" id="rooms-list"></div>

    <button class="new-room-btn" id="btn-new-room">
      ＋ Buat Room Baru
    </button>
  </div>

  <!-- Chat area -->
  <div id="chat-area">
    <div id="welcome-screen">
      <div class="big-icon">💬</div>
      <h2>Chet</h2>
      <p>Pilih room di kiri untuk mulai ngobrol. Semua pesan tersimpan real-time di Firebase.</p>
    </div>

    <div class="chat-header" id="chat-header">
      <div class="avatar" id="chat-avatar">🗨</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-room-name">Room</div>
        <div class="chat-header-status">online</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-back" style="display:none">←</button>
      </div>
    </div>

    <div id="messages-area"></div>

    <div class="chat-input-area" id="input-area">
      <textarea id="msg-input" rows="1" placeholder="Ketik pesan..."></textarea>
      <button id="btn-send">➤</button>
    </div>
  </div>
</div>

<!-- New Room Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Buat Room Baru</h3>
    <input type="text" id="room-name-input" placeholder="Nama room (misal: general, santai)">
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-modal-cancel">Batal</button>
      <button class="btn-create" id="btn-modal-create">Buat</button>
    </div>
  </div>
</div>

<script>
  // ══════════════════════════════════════════════
  //  FIREBASE CONFIG — project: rhf-chet
  // ══════════════════════════════════════════════
  const firebaseConfig = {
    apiKey: "AIzaSyAq6Rb-T8vuSHoIReIIip3dX1WpLBTanSU",
    authDomain: "rhf-chet.firebaseapp.com",
    databaseURL: "https://rhf-chet-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rhf-chet",
    storageBucket: "rhf-chet.firebasestorage.app",
    messagingSenderId: "377817630880",
    appId: "1:377817630880:web:19a17073ee41e45e4721c5",
    measurementId: "G-BCXES5PJS0"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();
  try { firebase.analytics(); } catch (e) { /* analytics may be blocked, non-fatal */ }

  // ── state ──
  let currentUser   = null;
  let currentRoom   = null;
  let msgUnsubscribe = null;
  let roomsUnsubscribe = null;

  // ── elements ──
  const loginScreen  = document.getElementById('login-screen');
  const app          = document.getElementById('app');
  const userAvatar   = document.getElementById('user-avatar');
  const userName     = document.getElementById('user-name');
  const roomsList    = document.getElementById('rooms-list');
  const messagesArea = document.getElementById('messages-area');
  const msgInput     = document.getElementById('msg-input');
  const btnSend      = document.getElementById('btn-send');
  const chatHeader   = document.getElementById('chat-header');
  const inputArea    = document.getElementById('input-area');
  const chatRoomName = document.getElementById('chat-room-name');
  const chatAvatar   = document.getElementById('chat-avatar');
  const welcomeScreen= document.getElementById('welcome-screen');
  const sidebar      = document.getElementById('sidebar');
  const chatArea     = document.getElementById('chat-area');
  const btnBack      = document.getElementById('btn-back');
  const searchInput  = document.getElementById('search-input');
  const modalOverlay = document.getElementById('modal-overlay');

  // ── auth ──
  document.getElementById('btn-google').addEventListener('click', () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(e => alert('Login gagal: ' + e.message));
  });

  document.getElementById('btn-logout').addEventListener('click', () => {
    if (confirm('Yakin mau keluar?')) auth.signOut();
  });

  auth.onAuthStateChanged(user => {
    currentUser = user;
    if (user) {
      loginScreen.style.display = 'none';
      app.classList.add('visible');
      if (user.photoURL) {
        userAvatar.innerHTML = `<img src="${user.photoURL}" alt="">`;
      } else {
        userAvatar.textContent = user.displayName?.[0] || '👤';
      }
      userName.textContent = user.displayName || user.email;
      db.collection('users').doc(user.uid).set({
        name: user.displayName || user.email,
        photo: user.photoURL || null,
        lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      loadRooms();
    } else {
      loginScreen.style.display = 'flex';
      app.classList.remove('visible');
      if (roomsUnsubscribe) roomsUnsubscribe();
      if (msgUnsubscribe)   msgUnsubscribe();
    }
  });

  // ── rooms ──
  function loadRooms() {
    if (roomsUnsubscribe) roomsUnsubscribe();
    roomsUnsubscribe = db.collection('rooms')
      .orderBy('lastActivity', 'desc')
      .onSnapshot(snap => {
        const filter = searchInput.value.toLowerCase();
        roomsList.innerHTML = '';
        snap.forEach(doc => {
          const room = { id: doc.id, ...doc.data() };
          if (filter && !room.name.toLowerCase().includes(filter)) return;
          renderRoomItem(room);
        });
      });
  }

  function renderRoomItem(room) {
    const div = document.createElement('div');
    div.className = 'room-item' + (currentRoom?.id === room.id ? ' active' : '');
    div.dataset.id = room.id;

    const lastMsg = room.lastMessage || 'Belum ada pesan';
    const lastTime = room.lastActivity
      ? formatTime(room.lastActivity.toDate())
      : '';

    div.innerHTML = `
      <div class="room-icon">${room.emoji || '💬'}</div>
      <div class="room-info">
        <div class="room-name">${escHtml(room.name)}</div>
        <div class="room-preview">${escHtml(lastMsg)}</div>
      </div>
      <div class="room-meta">
        <span class="room-time">${lastTime}</span>
      </div>
    `;
    div.addEventListener('click', () => openRoom(room));
    roomsList.appendChild(div);
  }

  function openRoom(room) {
    currentRoom = room;
    document.querySelectorAll('.room-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === room.id);
    });

    welcomeScreen.style.display = 'none';
    chatHeader.classList.add('visible');
    inputArea.classList.add('visible');
    chatRoomName.textContent = room.name;
    chatAvatar.textContent = room.emoji || '💬';

    if (window.innerWidth <= 640) {
      sidebar.classList.add('hidden');
      chatArea.classList.remove('hidden');
      btnBack.style.display = 'flex';
    }

    loadMessages(room.id);
  }

  btnBack.addEventListener('click', () => {
    sidebar.classList.remove('hidden');
    chatArea.classList.add('hidden');
    btnBack.style.display = 'none';
  });

  // ── messages ──
  function loadMessages(roomId) {
    if (msgUnsubscribe) msgUnsubscribe();
    messagesArea.innerHTML = '';
    let lastDateStr = '';

    msgUnsubscribe = db.collection('rooms').doc(roomId)
      .collection('messages')
      .orderBy('createdAt', 'asc')
      .limitToLast(100)
      .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
          if (change.type === 'added') {
            const msg = { id: change.doc.id, ...change.doc.data() };

            const dateStr = msg.createdAt
              ? formatDate(msg.createdAt.toDate())
              : 'Hari ini';
            if (dateStr !== lastDateStr) {
              lastDateStr = dateStr;
              const div = document.createElement('div');
              div.className = 'date-divider';
              div.textContent = dateStr;
              messagesArea.appendChild(div);
            }

            renderMessage(msg);
          }
        });
        scrollToBottom();
      });
  }

  function renderMessage(msg) {
    const isOut = msg.uid === currentUser?.uid;
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ' + (isOut ? 'out' : 'in');

    const time = msg.createdAt ? formatTime(msg.createdAt.toDate()) : '';

    wrapper.innerHTML = `
      <div class="msg-bubble">
        ${!isOut ? `<div class="msg-sender">${escHtml(msg.senderName || 'User')}</div>` : ''}
        <div class="msg-text">${escHtml(msg.text)}</div>
        <div class="msg-meta">
          <span class="msg-time">${time}</span>
          ${isOut ? '<span class="msg-tick">✓✓</span>' : ''}
        </div>
      </div>
    `;
    messagesArea.appendChild(wrapper);
  }

  // ── send message ──
  function sendMessage() {
    const text = msgInput.value.trim();
      if (!text || !currentRoom || !currentUser) return;

    msgInput.value = '';
    msgInput.style.height = 'auto';
    btnSend.disabled = true;

    const roomRef = db.collection('rooms').doc(currentRoom.id);
    const batch = db.batch();

    const msgRef = roomRef.collection('messages').doc();
    batch.set(msgRef, {
      text,
      uid:        currentUser.uid,
      senderName: currentUser.displayName || currentUser.email,
      senderPhoto:currentUser.photoURL || null,
      createdAt:  firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.update(roomRef, {
      lastMessage:  text.length > 50 ? text.slice(0, 50) + '…' : text,
      lastActivity: firebase.firestore.FieldValue.serverTimestamp()
    });

    batch.commit()
      .catch(e => alert('Gagal kirim: ' + e.message))
      .finally(() => { btnSend.disabled = false; });
  }

  btnSend.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  // ── new room modal ──
  document.getElementById('btn-new-room').addEventListener('click', () => {
    modalOverlay.classList.add('open');
    document.getElementById('room-name-input').value = '';
    document.getElementById('room-name-input').focus();
  });

  document.getElementById('btn-modal-cancel').addEventListener('click', () => {
    modalOverlay.classList.remove('open');
  });

  document.getElementById('btn-modal-create').addEventListener('click', createRoom);
  document.getElementById('room-name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') createRoom();
  });

  const ROOM_EMOJIS = ['💬','🎯','🔥','🌊','⚡','🎮','🎵','🧠','🌙','☕'];

  function createRoom() {
    const name = document.getElementById('room-name-input').value.trim();
    if (!name) return;

    const emoji = ROOM_EMOJIS[Math.floor(Math.random() * ROOM_EMOJIS.length)];

    db.collection('rooms').add({
      name,
      emoji,
      createdBy:    currentUser.uid,
      createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
      lastActivity: firebase.firestore.FieldValue.serverTimestamp(),
      lastMessage:  ''
    })
    .then(doc => {
      modalOverlay.classList.remove('open');
      openRoom({ id: doc.id, name, emoji });
    })
    .catch(e => alert('Gagal buat room: ' + e.message));
  }

  // ── search ──
  searchInput.addEventListener('input', loadRooms);

  // ── utils ──
  function scrollToBottom() {
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function formatTime(date) {
    return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function formatDate(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return 'Hari ini';
    if (date.toDateString() === yesterday.toDateString()) return 'Kemarin';
    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  window.addEventListener('resize', () => {
    if (window.innerWidth > 640) {
      sidebar.classList.remove('hidden');
      chatArea.classList.remove('hidden');
      btnBack.style.display = 'none';
    }
  });
</script>
</body>
</html>
